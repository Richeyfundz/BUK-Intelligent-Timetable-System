<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BUK Intelligent Timetable Management System</title>

    <!-- Bootstrap CSS -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="login-wrapper">
      <div class="login-card">
        <!-- Logo -->

        <div class="text-center mb-4">
          <img src="images/buk-logo.png" alt="BUK Logo" class="login-logo" />

          <h3 class="mt-3">Bayero University Kano</h3>

          <p class="text-muted">Intelligent Timetable Management System</p>
        </div>

        <!-- Login Form -->

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label"> Username </label>

            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-person-fill"></i>
              </span>

              <input
                type="text"
                id="username"
                class="form-control"
                placeholder="Enter Username"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label"> Password </label>

            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-lock-fill"></i>
              </span>

              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter Password"
                required
              />

              <button
                class="btn btn-outline-secondary"
                type="button"
                id="togglePassword"
              >
                <i class="bi bi-eye-fill"></i>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-between mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" />

              <label class="form-check-label" for="rememberMe">
                Remember Me
              </label>
            </div>

            <a href="#" class="text-decoration-none"> Forgot Password? </a>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right"></i>

            Login
          </button>
        </form>

        <hr />

        <div class="text-center">
          <small> © 2026 Bayero University Kano </small>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Login Script -->

    <script src="js/app.js"></script>
  </body>
</html>
